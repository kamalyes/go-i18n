name: Bump Upstream

# 实际流程全在 kamalyes/deploy-pipeline 的 go-bump-upstream.yml 里，三十来个 Go 库共用一份
#
# 这里原先是本仓库自写的一百五十行实现，只做了 go build，没有 vet 也没有测试：
# go mod tidy 只解析 import、不做类型检查，go build 也查不出行为变更，
# 于是上游一次不兼容改动就会被自动提交、打上 tag 发布出去，而且没有任何人工介入点
#
# 换成共用流水线之后多了一组关不掉的闸门：升完依赖先 build + vet + test，
# 三道全过才允许推默认分支；任一道没过就开分支提 PR 并把 job 判红，默认分支一行不动
#
# 自写版里那段「编译嵌套子模块」的循环在本仓库没有对应物（没有嵌套 go.mod），
# 真要用也有 post-test-script 这个入口，不需要为它保留整套自写流程
#
# [EN] This used to be a hundred and fifty lines written in this repository that ran only
# go build, with no vet and no tests. go mod tidy resolves imports without type-checking and
# go build cannot see a behaviour change, so one incompatible upstream release would be
# committed and tagged automatically with no point of human review. The shared pipeline adds
# gates that cannot be switched off: a bump must build, vet and test before it may touch the
# default branch, and otherwise becomes a branch and a pull request while the default branch
# is left alone. The nested-module loop the old version carried has nothing to act on here

on:
  repository_dispatch:
    types: [upstream-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-upstream
  cancel-in-progress: false

jobs:
  bump:
    uses: kamalyes/deploy-pipeline/.github/workflows/go-bump-upstream.yml@master
    secrets:
      # 凭证按 App 到 PAT 到 GITHUB_TOKEN 取，优先 App 是因为 PAT 得逐仓库配，
      # 而漏配时会悄悄回落到 GITHUB_TOKEN，用它推的提交不触发任何 workflow，
      # bump 落了地 CI 根本不跑
      # [EN] Credentials are taken App first, then PAT, because a PAT must be set per
      # repository and a missing one falls back to GITHUB_TOKEN, whose pushes trigger no
      # workflow at all
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GH_GPA_TOKEN: ${{ secrets.GH_GPA_TOKEN }}
      PIPELINE_SECRETS: ${{ secrets.PIPELINE_SECRETS }}
